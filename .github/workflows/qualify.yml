name: Qualify private source before merge
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: github-pages
    steps:
      - name: Check out private review branch
        uses: actions/checkout@v6
        with:
          repository: BarefootWeather/weather-source
          ref: 0d1aa979a7d96d02d34dda9ba9fb20c81712488c
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Require JavaScript test runtime
        run: node --version
      - name: Verify all tests without publishing private diagnostics
        run: |
          if ! python -m unittest discover -s tests -v > "$RUNNER_TEMP/tests.log" 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git switch -c codex/review-diagnostics > "$RUNNER_TEMP/diagnostic-git.log" 2>&1
            cp "$RUNNER_TEMP/tests.log" review-test-results.txt
            git add -- review-test-results.txt
            git commit -m 'Private Linux test diagnostics [skip ci]' >> "$RUNNER_TEMP/diagnostic-git.log" 2>&1
            git push origin HEAD:refs/heads/codex/review-diagnostics >> "$RUNNER_TEMP/diagnostic-git.log" 2>&1
            echo 'Qualification failed. Diagnostics are saved only in the private source repository.' 
            exit 1
          fi
          tail -n 4 "$RUNNER_TEMP/tests.log"
